name: Release

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          server-id: github
          server-username-env-var: GITHUB_ACTOR
          server-password-env-var: GITHUB_TOKEN

      - name: Version from date and branch
        id: version
        run: |
          branch="${GITHUB_REF_NAME//\//_}"
          branch="$(printf '%s' "$branch" | sed -E 's/[^A-Za-z0-9_-]+/_/g; s/^_+//; s/_+$//')"
          if [ -z "$branch" ]; then
            echo "::error::Branch name cannot be used as a version"
            exit 1
          fi
          version="${branch}-$(date -u +%y%m%d)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Release version $version"

      - name: Test
        run: mvn -B verify

      - name: Set release version
        run: mvn -B versions:set -DnewVersion="${{ steps.version.outputs.version }}" -DgenerateBackupPoms=false

      - name: Replace the existing release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release delete "$VERSION" --yes --cleanup-tag
          fi
          gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/git/refs/tags/${VERSION}" >/dev/null 2>&1 || true
          packages="$(gh api --paginate "/repos/${GITHUB_REPOSITORY}/packages?package_type=maven" --jq '.[].name' 2>/dev/null || true)"
          for package in $packages; do
            versions_url="/repos/${GITHUB_REPOSITORY}/packages/maven/${package}/versions"
            ids="$(gh api --paginate "$versions_url" --jq ".[] | select(.name==\"${VERSION}\") | .id" 2>/dev/null || true)"
            for id in $ids; do
              case "$id" in
                ''|*[!0-9]*) continue ;;
              esac
              gh api --method DELETE "${versions_url}/${id}"
            done
          done

      - name: Publish to GitHub Packages
        run: mvn -B deploy -DskipTests -DaltDeploymentRepository="github::https://maven.pkg.github.com/${GITHUB_REPOSITORY}"

      - name: Publish GitHub release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$VERSION" \
            "target/spring-schema-migration-generator-${VERSION}.jar" \
            --title "$VERSION" \
            --target "$GITHUB_SHA" \
            --notes "Library build ${VERSION}"
