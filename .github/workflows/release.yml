name: Release

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          server-id: github
          server-username-env-var: GITHUB_ACTOR
          server-password-env-var: GITHUB_TOKEN

      - name: Version from date and branch
        id: version
        run: bash .github/scripts/release-version.sh

      - name: Test
        run: mvn -B verify

      - name: Set release version
        run: mvn -B versions:set -DnewVersion="${{ steps.version.outputs.version }}" -DgenerateBackupPoms=false

      - name: Replace the existing release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bash .github/scripts/delete-github-release.sh

      - name: Publish to GitHub Packages
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bash .github/scripts/publish-maven.sh

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          body: Library build ${{ steps.version.outputs.version }}
          files: target/spring-schema-migration-generator-${{ steps.version.outputs.version }}.jar
          fail_on_unmatched_files: true
